<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Screener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }
    header span { font-size: 0.85rem; color: #8899bb; }

    .container { max-width: 1000px; margin: 40px auto; padding: 0 24px; }

    /* INPUT SECTION */
    #input-section {}

    .tagline {
      text-align: center;
      margin-bottom: 36px;
    }
    .tagline h2 { font-size: 1.8rem; font-weight: 700; color: #1a1a2e; }
    .tagline p { margin-top: 8px; color: #6b7280; font-size: 1rem; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #374151;
    }

    .field textarea {
      width: 100%;
      height: 320px;
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      resize: vertical;
      line-height: 1.6;
      transition: border-color 0.2s;
      background: white;
    }

    .field textarea:focus {
      outline: none;
      border-color: #4f46e5;
    }

    .field textarea::placeholder { color: #9ca3af; }

    .submit-row { text-align: center; }

    #screen-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.2px;
    }

    #screen-btn:hover { background: #4338ca; }
    #screen-btn:active { transform: scale(0.98); }
    #screen-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .loading {
      display: none;
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #e5e7eb;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULTS SECTION */
    #results-section { display: none; }

    .back-btn {
      background: none;
      border: 1px solid #d1d5db;
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 24px;
      color: #374151;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #f9fafb; }

    .decision-banner {
      border-radius: 14px;
      padding: 28px 32px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .decision-banner.advance { background: #d1fae5; border: 2px solid #6ee7b7; }
    .decision-banner.reject  { background: #fee2e2; border: 2px solid #fca5a5; }

    .decision-label {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .advance .decision-label { color: #065f46; }
    .reject  .decision-label { color: #991b1b; }

    .decision-meta { font-size: 0.95rem; color: #4b5563; max-width: 600px; }
    .decision-meta strong { display: block; margin-bottom: 4px; font-size: 1rem; }

    .confidence-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: white;
      opacity: 0.85;
    }

    .advance .confidence-badge { color: #065f46; }
    .reject  .confidence-badge { color: #991b1b; }

    .time-saved-bar {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 0.9rem;
      color: #1e40af;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      border: 1px solid #e5e7eb;
    }

    .card h3 {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .score-label { font-size: 0.9rem; color: #374151; width: 140px; }
    .score-bar-wrap { flex: 1; height: 8px; background: #f3f4f6; border-radius: 4px; margin: 0 12px; overflow: hidden; }
    .score-bar { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
    .score-num { font-size: 0.9rem; font-weight: 600; width: 36px; text-align: right; }

    .bullet-list { list-style: none; }
    .bullet-list li {
      padding: 6px 0;
      font-size: 0.92rem;
      color: #374151;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.5;
    }
    .bullet-list li:last-child { border-bottom: none; }
    .bullet-list .dot { margin-top: 6px; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .strengths .dot { background: #10b981; }
    .gaps .dot     { background: #f59e0b; }

    .summary-card { background: white; border-radius: 12px; padding: 22px; border: 1px solid #e5e7eb; }
    .summary-card h3 {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b7280;
      margin-bottom: 12px;
    }
    .summary-card p { font-size: 0.95rem; line-height: 1.7; color: #374151; }
    .copy-btn {
      margin-top: 14px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
      color: #374151;
    }
    .copy-btn:hover { background: #e5e7eb; }

    .error-box {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 16px 20px;
      color: #991b1b;
      font-size: 0.95rem;
      display: none;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<header>
  <h1>Job Application Screener</h1>
  <span>Powered by Groq · Llama 3.3</span>
</header>

<div class="container">

  <!-- INPUT -->
  <div id="input-section">
    <div class="tagline">
      <h2>Screen a Candidate in Seconds</h2>
      <p>Paste the job description and resume below. Get an instant hiring recommendation.</p>
    </div>

    <div class="form-grid">
      <div class="field">
        <label for="job-desc">Job Description</label>
        <textarea id="job-desc" placeholder="Paste the full job description here — title, responsibilities, qualifications, etc."></textarea>
      </div>
      <div class="field">
        <label for="resume">Candidate Resume</label>
        <textarea id="resume" placeholder="Paste the candidate's resume text here."></textarea>
      </div>
    </div>

    <div class="submit-row">
      <button id="screen-btn" onclick="screenCandidate()">Screen This Candidate</button>
    </div>
    <div class="error-box" id="error-box"></div>
  </div>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Analyzing candidate against job requirements...</p>
  </div>

  <!-- RESULTS -->
  <div id="results-section">
    <button class="back-btn" onclick="resetForm()">← Screen Another Candidate</button>

    <div class="decision-banner" id="decision-banner">
      <div>
        <div class="decision-label" id="decision-label"></div>
        <div class="decision-meta">
          <strong id="decision-reason"></strong>
        </div>
      </div>
      <div class="confidence-badge" id="confidence-badge"></div>
    </div>

    <div class="time-saved-bar" id="time-saved-bar"></div>

    <div class="results-grid">
      <div class="card">
        <h3>Category Scores</h3>
        <div id="scores-container"></div>
      </div>

      <div class="card">
        <h3>Strengths &amp; Gaps</h3>
        <ul class="bullet-list strengths" id="strengths-list"></ul>
        <div style="height:1px; background:#f3f4f6; margin: 12px 0;"></div>
        <ul class="bullet-list gaps" id="gaps-list"></ul>
      </div>
    </div>

    <div class="summary-card">
      <h3>Recruiter Summary</h3>
      <p id="summary-text"></p>
      <button class="copy-btn" onclick="copySummary()">Copy to Clipboard</button>
    </div>
  </div>

</div>

<script>
  async function screenCandidate() {
    const jobDescription = document.getElementById('job-desc').value.trim();
    const resume = document.getElementById('resume').value.trim();
    const errBox = document.getElementById('error-box');

    errBox.style.display = 'none';

    if (!jobDescription || !resume) {
      errBox.textContent = 'Please paste both a job description and a resume before screening.';
      errBox.style.display = 'block';
      return;
    }

    document.getElementById('input-section').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    try {
      const res = await fetch('/screen', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobDescription, resume }),
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Unknown error');

      renderResults(data);
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('input-section').style.display = 'block';
      errBox.textContent = 'Error: ' + err.message;
      errBox.style.display = 'block';
    }
  }

  function renderResults(data) {
    document.getElementById('loading').style.display = 'none';

    const isAdvance = data.decision === 'ADVANCE';

    const banner = document.getElementById('decision-banner');
    banner.className = 'decision-banner ' + (isAdvance ? 'advance' : 'reject');
    document.getElementById('decision-label').textContent = isAdvance ? '✓ Advance' : '✗ Reject';
    document.getElementById('decision-reason').textContent = data.decision_reason;
    document.getElementById('confidence-badge').textContent = data.confidence + ' Confidence';

    const t = parseFloat(data.screening_time_seconds);
    const saved = Math.max(0, (180 - t)).toFixed(0);
    document.getElementById('time-saved-bar').innerHTML =
      `⚡ Screening completed in <strong>${t}s</strong> &nbsp;·&nbsp; Estimated time saved vs. manual review: <strong>${saved} seconds</strong> (~3 min average) &nbsp;·&nbsp; At 200 applicants: <strong>${Math.round(saved * 200 / 60)} minutes saved</strong>`;

    const scoreLabels = {
      skills_match: 'Skills Match',
      experience_level: 'Experience',
      education_fit: 'Education Fit',
      overall_fit: 'Overall Fit',
    };

    const scoresContainer = document.getElementById('scores-container');
    scoresContainer.innerHTML = '';
    for (const [key, label] of Object.entries(scoreLabels)) {
      const val = data.scores[key] ?? 0;
      const color = val >= 70 ? '#10b981' : val >= 45 ? '#f59e0b' : '#ef4444';
      scoresContainer.innerHTML += `
        <div class="score-row">
          <span class="score-label">${label}</span>
          <div class="score-bar-wrap"><div class="score-bar" style="width:${val}%; background:${color};"></div></div>
          <span class="score-num" style="color:${color}">${val}</span>
        </div>`;
    }

    const strengthsList = document.getElementById('strengths-list');
    strengthsList.innerHTML = (data.strengths || []).map(s =>
      `<li><span class="dot"></span>${s}</li>`).join('');

    const gapsList = document.getElementById('gaps-list');
    gapsList.innerHTML = (data.gaps || []).map(g =>
      `<li><span class="dot"></span>${g}</li>`).join('');

    document.getElementById('summary-text').textContent = data.summary;

    document.getElementById('results-section').style.display = 'block';
  }

  function resetForm() {
    document.getElementById('results-section').style.display = 'none';
    document.getElementById('input-section').style.display = 'block';
  }

  function copySummary() {
    const text = document.getElementById('summary-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy to Clipboard', 2000);
    });
  }
</script>
</body>
</html>
